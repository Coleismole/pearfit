# Fails when the generated files committed under website/ no longer match the sources.
# website/api/recommend.js, candidates.js, website/api/scraper, website/scraper and website/stores.json are build
# output that Vercel serves as committed (the project is rooted at website/). See scripts/check-bundles.mjs for how the
# check works and why a plain rebuild-and-diff is reliable.
name: Check generated bundles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webscraper/package-lock.json
      # esbuild and vite come from webscraper's install, for both generators.
      - name: Install webscraper dependencies
        working-directory: webscraper
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Rebuild the generated bundles and compare them with the committed ones
        run: node scripts/check-bundles.mjs
