# Re-scrapes one product per confirmed store every week (webscraper/tools/verified-stores.json) and fails
# when more than 20 percent of the stores regressed: fewer than half the expected reviews, a new refusal,
# or a scraper error. A product page that is gone (404) or a store in maintenance is listed, not counted.
#
# It only reads. Every request says commitToDb false, and the scraper this job starts has its Supabase
# variables blanked, so nothing is written to any database. It needs no secrets and does not run on pull requests.
name: Verify stores

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only stores whose domain contains one of these (comma separated), for example gap.com,nike.com"
        required: false
        default: ""
      sample:
        description: "Check only this many stores, spread through the list (blank for all)"
        required: false
        default: ""
      threshold:
        description: "Fail above this share of regressed stores"
        required: false
        default: "0.2"

permissions:
  contents: read

concurrency:
  group: verify-stores
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: webscraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webscraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the scraper
        run: npx playwright install --with-deps chromium

      - name: Verify stores
        env:
          ONLY: ${{ github.event.inputs.only }}
          SAMPLE: ${{ github.event.inputs.sample }}
          THRESHOLD: ${{ github.event.inputs.threshold }}
        run: |
          # 270 minutes of the 300 the job may run: stores not started by then are reported as not checked,
          # so a slow run still ends with a report.
          args=(--out-dir "$RUNNER_TEMP/verify-report" --concurrency 2 --threshold "${THRESHOLD:-0.2}" --max-minutes 270)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$SAMPLE" ]; then args+=(--sample "$SAMPLE"); fi
          npm run verify-stores -- "${args[@]}"

      - name: Show the report in the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/verify-report/verify-report.md" ]; then
            cat "$RUNNER_TEMP/verify-report/verify-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-stores-report
          path: ${{ runner.temp }}/verify-report
          if-no-files-found: warn
          retention-days: 90
