<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5E3E}a:hover{color:#1F4029}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F0; font-family: 'Inter', sans-serif; color: #17251C; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 28px 20px 16px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Account</h1>

    <div style="background: #FFFFFF; border: 1px solid #DDE2D6; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="width: 48px; height: 48px; border-radius: 999px; background: #C9DB5A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; color: #17251C">[A]</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 600">[Your name]</div>
        <div style="font-size: 13px; color: #56635A">[your@email.com]</div>
      </div>
      <button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #2E5E3E; cursor: pointer">Switch</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #56635A; text-transform: uppercase; letter-spacing: 0.4px">App</h2>
      <div style="background: #FFFFFF; border: 1px solid #DDE2D6; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 15px">Appearance</div>
        <div style="display: flex; background: #E3E8DC; border-radius: 12px; padding: 4px">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #56635A; text-transform: uppercase; letter-spacing: 0.4px">Account</h2>
      <div style="background: #FFFFFF; border: 1px solid #DDE2D6; border-radius: 16px; padding: 0 16px; display: flex; flex-direction: column">
        <button type="button" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; border: none; border-bottom: 1px solid #EEF1EA; background: transparent; font: inherit; font-size: 15px; color: #17251C; padding: 0; cursor: pointer">Change password<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <button type="button" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; border: none; border-bottom: 1px solid #EEF1EA; background: transparent; font: inherit; font-size: 15px; color: #17251C; padding: 0; cursor: pointer">Switch account<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <button type="button" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; border: none; border-bottom: 1px solid #EEF1EA; background: transparent; font: inherit; font-size: 15px; color: #17251C; padding: 0; cursor: pointer">Reset wardrobe data<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <button type="button" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; border: none; background: transparent; font: inherit; font-size: 15px; color: #17251C; padding: 0; cursor: pointer">Sign out<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>

    <button type="button" style="min-height: 50px; border-radius: 16px; border: 1px solid #F0C9C4; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #B42318; cursor: pointer">Delete account</button>
    <div style="text-align: center; font-size: 12px; color: #56635A">Pearfit · version [x.x]</div>
  </div>

  <nav style="display: flex; border-top: 1px solid #DDE2D6; background: #FFFFFF; padding: 8px 12px 22px">
    <a href="Main.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #56635A; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a>
    <a href="Wardrobe.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #56635A; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 2 2v1.5L3.4 15.6a1 1 0 0 0 .6 1.9h16a1 1 0 0 0 .6-1.9L12 8.5"></path></svg>Wardrobe</a>
    <a href="Account.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #2E5E3E; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Account</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: 'System' }; }
  renderVals() {
    const on = 'flex: 1; min-height: 40px; border: none; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #17251C; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer;';
    const off = 'flex: 1; min-height: 40px; border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #56635A; cursor: pointer;';
    const themes = ['Light', 'Dark', 'System'].map((t) => ({
      label: t,
      pressed: t === this.state.theme ? 'true' : 'false',
      style: t === this.state.theme ? on : off,
      pick: () => this.setState({ theme: t })
    }));
    return { themes };
  }
}
</script>
</body>
</html>
