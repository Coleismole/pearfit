<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare fit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5E3E}a:hover{color:#1F4029}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F0; font-family: 'Inter', sans-serif; color: #17251C; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Analysis.dc.html" aria-label="Back to analysis" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #17251C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Compare fit</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border: 1.5px solid #2E5E3E; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 11px; font-weight: 700; color: #2E5E3E; letter-spacing: 0.5px; text-transform: uppercase">New · size {{ size }}</div>
      <div style="height: 84px; border-radius: 10px; background: #E2ECE0"></div>
      <div style="font-size: 14px; font-weight: 600; line-height: 1.3">Everyday Oxford Shirt</div>
      <div style="font-size: 12px; color: #56635A">Harbor &amp; Co · {{ size }} · {{ pct }} suitable</div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE2D6; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 11px; font-weight: 700; color: #56635A; letter-spacing: 0.5px; text-transform: uppercase">You own · fit 85</div>
      <div style="height: 84px; border-radius: 10px; background: #DCE6EF"></div>
      <div style="font-size: 14px; font-weight: 600; line-height: 1.3">Oxford Shirt, Slim Fit</div>
      <div style="font-size: 12px; color: #56635A">Northline · M</div>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DDE2D6; border-radius: 16px; padding: 4px 14px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <div style="{{ r.rowStyle }}">
        <div style="font-size: 13px; color: #56635A">{{ r.label }}</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
          <div style="font-size: 17px; font-weight: 700">{{ r.a }}</div>
          <div style="font-size: 17px; font-weight: 500; color: #56635A; text-align: center">{{ r.b }}</div>
          <div style="display: flex; justify-content: flex-end"><span style="{{ r.chipStyle }}">{{ r.diff }}</span></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="background: #E6ECDC; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #1F4029">{{ summary }}</div>

  <div style="flex: 1"></div>
  <div style="display: flex; gap: 10px">
    <button type="button" onClick="{{ toggleSize }}" style="flex: 1; min-height: 52px; border-radius: 16px; border: 1px solid #C9D0C1; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1F4029; cursor: pointer">{{ otherLabel }}</button>
    <a href="WardrobePlanned.dc.html" style="flex: 1.4; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #2E5E3E; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Save {{ size }} to planned</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { size: 'M' }; }
  renderVals() {
    const labels = [
      ['Chest width', 'roomier', 'tighter'],
      ['Shirt length', 'longer', 'shorter'],
      ['Sleeve length', 'longer', 'shorter'],
      ['Shoulder width', 'wider', 'narrower'],
      ['Waist width', 'roomier', 'tighter'],
      ['Hem width', 'roomier', 'tighter']
    ];
    const mine = [54, 74, 64, 45, 50, 52];
    const sizes = {
      M: { vals: [55, 75, 63, 46, 52, 53], pct: '88%', summary: 'Fits like your Oxford Shirt, with 2 cm more room at the waist.' },
      L: { vals: [57, 77, 65, 48, 54, 55], pct: '72%', summary: 'Size L runs bigger than your Oxford Shirt: 4 cm roomier at the waist and 3 cm longer in the body.' }
    };
    const cur = this.state.size;
    const d = sizes[cur];
    const rows = labels.map((l, i) => {
      const diff = d.vals[i] - mine[i];
      const big = Math.abs(diff) >= 2;
      return {
        label: l[0],
        a: d.vals[i] + ' cm',
        b: mine[i] + ' cm',
        diff: diff === 0 ? 'Same' : (diff > 0 ? '+' : '−') + Math.abs(diff) + ' ' + (diff > 0 ? l[1] : l[2]),
        chipStyle: 'padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; ' + (big ? 'background: #F7E2D3; color: #8A3A10;' : 'background: #E6ECDC; color: #1F4029;'),
        rowStyle: 'display: flex; flex-direction: column; gap: 4px; padding: 9px 0;' + (i < labels.length - 1 ? ' border-bottom: 1px solid #EEF1EA;' : '')
      };
    });
    return {
      size: cur,
      pct: d.pct,
      summary: d.summary,
      rows,
      otherLabel: cur === 'M' ? 'Try size L' : 'Back to size M',
      toggleSize: () => this.setState({ size: cur === 'M' ? 'L' : 'M' })
    };
  }
}
</script>
</body>
</html>
